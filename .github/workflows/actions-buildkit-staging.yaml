name: Test BuildKit Runner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 10 * * *' # (UTC 10am everyday, and it corresponds to 3 am PDT everyday.)

jobs:
  test-buildkit:
    name: Test BuildKit Build
    runs-on: test-linux-n2-buildkit
    # For CONTAINER hardwareType, a job container is required
    container:
      image: gcr.io/google.com/cloudsdktool/google-cloud-cli:582.0.0
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Explicitly disable credential persistence
          persist-credentials: false

      - name: Configure Docker Authentication
        run: gcloud auth configure-docker us-docker.pkg.dev,gcr.io -q

      # Connects BuildX to the rootless buildkitd sidecar running in the runner pod
      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver: remote
          endpoint: tcp://localhost:1234

      - name: Create Minimal Test Dockerfile
        run: |
          cat << 'EOF' > Dockerfile
          FROM alpine:latest
          RUN echo "BuildKit rootless daemon build succeeded!"
          EOF
      - name: Build test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          tags: test-buildkit:latest

